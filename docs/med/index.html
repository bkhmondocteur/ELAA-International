<body>

  <!-- Application Flutter Bootstrap -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- ═══════════════════════════════════════════════════════════
       MODULE MULTI-ACTEURS DOCPOCKET PRO (côté Médecin)
       — Machine à états + GPS Live + P2P GDP Relay
  ════════════════════════════════════════════════════════════ -->
  <script src="docpocket-multi-actors.js" defer></script>

  <script>
    window.addEventListener('load', function () {
      let attempts = 0;
      const tryInstall = setInterval(function () {
        attempts++;
        if (window.DocPocketMultiActors && window.app) {
          clearInterval(tryInstall);
          window.DocPocketMultiActors.install(window.app);
        } else if (attempts > 100) {
          clearInterval(tryInstall);
          console.warn('[DocPocket Med] window.app non détecté après 10s.');
        }
      }, 100);
    });
  </script>

</body>
