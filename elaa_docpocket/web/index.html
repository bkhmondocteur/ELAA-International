<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    ELAA DocPocket Pro — Application Web/Electron
    Architecture Multi-Acteurs : Hub Opérateur + Module Médecin + Cockpit Assurance
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ELAA DocPocket Pro — Plateforme médicale multi-acteurs ELAA International">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ELAA DocPocket Pro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ELAA DocPocket Pro</title>
  <link rel="manifest" href="manifest.json">

  <!-- ═══════════════════════════════════════════════════════════
       DÉPENDANCES EXTERNES — Module Multi-Acteurs
  ════════════════════════════════════════════════════════════ -->

  <!-- jsPDF + autoTable : génération PDF (Bilan comptable consolidé) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <!-- LocalForage : stockage local offline (GDP scans, cache) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

  <!-- Note : Leaflet est chargé dynamiquement à la demande
       par insuranceCockpit.ensureLeafletLoaded() (évite de ralentir
       le chargement initial si le cockpit n'est pas ouvert) -->

</head>
<body>

  <!-- Application Flutter Bootstrap -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- ═══════════════════════════════════════════════════════════
       MODULE MULTI-ACTEURS DOCPOCKET PRO
       Chargé après Flutter pour s'accrocher sur window.app
  ════════════════════════════════════════════════════════════ -->
  <script src="docpocket-multi-actors.js" defer></script>

  <!--
    AUTO-INSTALLATION : le module s'installe automatiquement
    dès que l'objet global `window.app` est prêt.

    Si votre app Flutter expose un objet `window.app`, appelez :
      window.DocPocketMultiActors.install(window.app, {
        doctorId:   'dr_ben_khalifa',
        doctorName: 'Dr Hamed Ben Khalifa'
      });

    Pour ouvrir manuellement le Cockpit Assurance :
      window.DocPocketMultiActors.insuranceCockpit.openCockpit(hotelsList);
  -->
  <script>
    // Attente que Flutter + le module soient prêts avant l'installation
    window.addEventListener('load', function () {
      // Polling léger (100 ms) jusqu'à ce que window.app soit disponible
      let attempts = 0;
      const tryInstall = setInterval(function () {
        attempts++;
        if (window.DocPocketMultiActors && window.app) {
          clearInterval(tryInstall);
          window.DocPocketMultiActors.install(window.app);
        } else if (attempts > 100) {
          // Après 10 s sans window.app : affichage du bouton Cockpit seul
          clearInterval(tryInstall);
          if (window.DocPocketMultiActors) {
            window.DocPocketMultiActors.injectCockpitLauncherButton(null);
            console.warn('[DocPocket] window.app non détecté — Cockpit disponible en standalone.');
          }
        }
      }, 100);
    });
  </script>

</body>
</html>
